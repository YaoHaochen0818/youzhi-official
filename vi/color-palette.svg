<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <style>
      text { font-family: 'Space Mono', 'Courier New', monospace; }
      .label { font-family: 'Noto Sans SC', sans-serif; }
    </style>
  </defs>

  <!-- Gold -->
  <rect x="20" y="20" width="170" height="170" rx="12" fill="#C9A96E"/>
  <text x="105" y="100" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">优炙金</text>
  <text x="105" y="125" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11">Youzhi Gold</text>
  <text x="105" y="155" text-anchor="middle" fill="rgba(0,0,0,0.4)" font-size="10">#C9A96E</text>
  <text x="105" y="175" text-anchor="middle" fill="rgba(0,0,0,0.35)" font-size="9">CMYK 15 25 60 0</text>

  <!-- Light Gold -->
  <rect x="215" y="20" width="170" height="170" rx="12" fill="#E8D5A3"/>
  <text x="300" y="100" text-anchor="middle" fill="#5a4a2a" font-size="14" font-weight="700">浅金</text>
  <text x="300" y="125" text-anchor="middle" fill="rgba(90,74,42,0.6)" font-size="11">Light Gold</text>
  <text x="300" y="155" text-anchor="middle" fill="rgba(90,74,42,0.5)" font-size="10">#E8D5A3</text>
  <text x="300" y="175" text-anchor="middle" fill="rgba(90,74,42,0.4)" font-size="9">CMYK 5 12 40 0</text>

  <!-- Deep Gold -->
  <rect x="410" y="20" width="170" height="170" rx="12" fill="#A6864B"/>
  <text x="495" y="100" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">深金</text>
  <text x="495" y="125" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="11">Deep Gold</text>
  <text x="495" y="155" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="10">#A6864B</text>
  <text x="495" y="175" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="9">CMYK 25 35 70 0</text>

  <!-- Brand Black -->
  <rect x="20" y="210" width="170" height="170" rx="12" fill="#08080C" stroke="#333" stroke-width="1"/>
  <text x="105" y="290" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">品牌黑</text>
  <text x="105" y="315" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="11">Brand Black</text>
  <text x="105" y="345" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-size="10">#08080C</text>

  <!-- Card Black -->
  <rect x="215" y="210" width="170" height="170" rx="12" fill="#0E0E14" stroke="#333" stroke-width="1"/>
  <text x="300" y="290" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">卡片黑</text>
  <text x="300" y="315" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="11">Card Black</text>
  <text x="300" y="345" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-size="10">#0E0E14</text>

  <!-- White -->
  <rect x="410" y="210" width="170" height="170" rx="12" fill="#FFFFFF" stroke="#ddd" stroke-width="1"/>
  <text x="495" y="290" text-anchor="middle" fill="#333" font-size="14" font-weight="700">白色</text>
  <text x="495" y="315" text-anchor="middle" fill="rgba(0,0,0,0.4)" font-size="11">White</text>
  <text x="495" y="345" text-anchor="middle" fill="rgba(0,0,0,0.35)" font-size="10">#FFFFFF</text>
</svg>
