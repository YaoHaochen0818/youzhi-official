<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A96E"/>
      <stop offset="50%" stop-color="#E8D5A3"/>
      <stop offset="100%" stop-color="#C9A96E"/>
    </linearGradient>
    <linearGradient id="goldSubtle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A96E" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#E8D5A3" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C9A96E" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Decorative ring -->
  <circle cx="62" cy="140" r="52" fill="none" stroke="url(#gold)" stroke-width="1.2" opacity="0.45"/>
  <circle cx="62" cy="140" r="40" fill="none" stroke="url(#gold)" stroke-width="0.8" opacity="0.25"/>

  <!-- 优炙 text -->
  <text x="135" y="165" font-family="'Noto Serif SC', 'SimSun', serif" font-size="120" font-weight="900" fill="url(#gold)" letter-spacing="8">优炙</text>

  <!-- YOUZHI -->
  <text x="142" y="210" font-family="'Cormorant Garamond', Georgia, serif" font-size="26" fill="#E8D5A3" letter-spacing="22" font-style="italic">YOUZHI</text>

  <!-- Decorative line -->
  <line x1="142" y1="225" x2="460" y2="225" stroke="url(#goldSubtle)" stroke-width="0.5"/>

  <!-- Tagline -->
  <text x="142" y="252" font-family="'Noto Sans SC', sans-serif" font-size="10" fill="rgba(255,255,255,0.25)" letter-spacing="6">PREMIUM PET NUTRITION</text>
</svg>
