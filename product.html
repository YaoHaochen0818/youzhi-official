<style>
:root{--gold:#C9A96E;--gold-light:#E8D5A3;--bg:#08080C;--bg-card:#0E0E14;--border:rgba(255,255,255,.06);--text:#FFF;--text-soft:rgba(255,255,255,.55);--text-dim:rgba(255,255,255,.3);--font-sans:'Noto Serif SC',serif;--font-serif:'Noto Serif SC',serif}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--text);font-family:var(--font-sans);font-weight:300;-webkit-font-smoothing:antialiased}

nav{position:fixed;top:0;left:0;right:0;z-index:1000;padding:.9rem 2.5rem;display:flex;justify-content:space-between;align-items:center;background:rgba(8,8,12,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
nav .logo{font-family:var(--font-serif);font-size:1.2rem;font-weight:700;color:#fff;text-decoration:none;letter-spacing:.06em}
nav .logo .gold{color:var(--gold)}
nav .links{display:flex;list-style:none;gap:2rem;align-items:center}
nav .links a{color:rgba(255,255,255,.5);text-decoration:none;font-size:.65rem;letter-spacing:.16em;text-transform:uppercase;transition:color .3s;font-weight:400}
nav .links a:hover{color:#fff}

.detail-hero{min-height:90vh;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:4rem;padding:6rem 4rem 4rem;max-width:1500px;margin:0 auto}
.dh-img{display:flex;align-items:center;justify-content:center;position:relative}
.dh-img .glow{position:absolute;width:100%;height:100%;background:radial-gradient(circle,rgba(201,169,110,.08),transparent 60%);border-radius:50%}
.dh-img img{width:75%;max-width:420px;position:relative;z-index:1;filter:drop-shadow(0 50px 100px rgba(0,0,0,.6)) brightness(.88) contrast(1.05);animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.dh-info .series{font-size:.55rem;letter-spacing:.3em;color:var(--gold);text-transform:uppercase;margin-bottom:1rem}
.dh-info h1{font-family:var(--font-serif);font-size:clamp(2.5rem,5vw,3.5rem);font-weight:900;line-height:1.15;margin-bottom:1rem}
.dh-info .subtitle{color:var(--text-soft);font-size:.88rem;line-height:2;margin-bottom:2rem}
.dh-info .highlights{display:grid;grid-template-columns:repeat(2,1fr);gap:.8rem;margin-bottom:2rem}
.dh-info .highlights .hl{display:flex;align-items:center;gap:.6rem;padding:.7rem 1rem;border:1px solid var(--border);border-radius:4px;font-size:.75rem;color:var(--text-soft)}
.dh-info .highlights .hl .dot{width:6px;height:6px;background:var(--gold);border-radius:50%;flex-shrink:0}
.dh-info .tags{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:2rem}
.dh-info .tags span{font-size:.65rem;padding:.4rem .9rem;border:1px solid rgba(201,169,110,.18);border-radius:100px;color:var(--text-soft)}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.85rem 2rem;font-size:.68rem;font-weight:500;letter-spacing:.12em;text-decoration:none;border-radius:2px;cursor:pointer;transition:all .35s;font-family:var(--font-sans)}
.btn-gold{background:var(--gold);color:#000;border:none}
.btn-gold:hover{background:var(--gold-light);transform:translateY(-2px);box-shadow:0 12px 40px rgba(201,169,110,.18)}

#gallery{padding:4rem 2rem 6rem;max-width:900px;margin:0 auto}
#gallery .section-label{font-size:.56rem;letter-spacing:.36em;color:var(--gold);text-transform:uppercase;margin-bottom:1rem}
#gallery .section-title{font-family:var(--font-serif);font-size:2rem;font-weight:700;margin-bottom:3rem}
.gallery-grid{display:flex;flex-direction:column;gap:0;max-width:800px;margin:0 auto}
.gallery-grid img{width:100%;display:block}

#nutrition{padding:6rem 4rem;background:var(--bg-card);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
#nutrition .section-label{font-size:.56rem;letter-spacing:.36em;color:var(--gold);text-transform:uppercase;margin-bottom:1rem}
#nutrition .section-title{font-family:var(--font-serif);font-size:2rem;font-weight:700;margin-bottom:3rem}
.nutrition-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--border);max-width:1000px;border-radius:12px;overflow:hidden}
.ng-item{background:var(--bg-card);padding:1.8rem 2rem;display:flex;justify-content:space-between;align-items:center;transition:background .3s}
.ng-item:hover{background:#12121A}
.ng-item .ng-name{font-size:.82rem;font-weight:300}
.ng-item .ng-val{font-family:var(--font-serif);font-size:1.25rem;color:var(--gold);font-weight:700}

#detail-feeding{padding:6rem 4rem;max-width:1000px;margin:0 auto}
#detail-feeding h3{font-family:var(--font-serif);font-size:1.5rem;margin-bottom:2rem;font-weight:700}
#detail-feeding .feed-info{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem}
#detail-feeding .fi-item{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:2rem 1.5rem;text-align:center;transition:all .4s}
#detail-feeding .fi-item:hover{border-color:rgba(201,169,110,.2)}
#detail-feeding .fi-item .fv{font-family:var(--font-serif);font-size:1.8rem;font-weight:900;color:var(--gold)}
#detail-feeding .fi-item .fl{font-size:.68rem;color:var(--text-dim);margin-top:.4rem}

#related{padding:6rem 4rem;background:var(--bg-card);border-top:1px solid var(--border)}
#related .section-label{font-size:.56rem;letter-spacing:.36em;color:var(--gold);text-transform:uppercase;margin-bottom:1rem}
.related-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;max-width:800px;margin:0 auto}
.r-card{background:var(--bg);border:1px solid var(--border);border-radius:14px;overflow:hidden;text-decoration:none;color:var(--text);transition:all .4s}
.r-card:hover{border-color:rgba(201,169,110,.22);transform:translateY(-4px)}
.r-card img{width:100%;aspect-ratio:1;object-fit:contain;padding:1.5rem;background:radial-gradient(circle,rgba(201,169,110,.04),transparent)}
.r-card .rc-info{padding:1rem 1.2rem 1.5rem}
.r-card .rc-info .rc-series{font-size:.5rem;color:var(--gold);letter-spacing:.22em;text-transform:uppercase}
.r-card .rc-info .rc-name{font-family:var(--font-serif);font-size:.85rem;font-weight:600;margin-top:.3rem}

footer{padding:3rem;border-top:1px solid var(--border);text-align:center;color:var(--text-dim);font-size:.65rem}

.quick-nav{position:fixed;bottom:0;left:0;right:0;z-index:999;background:rgba(8,8,12,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:.8rem 1.5rem;display:flex;align-items:center;gap:.6rem;justify-content:center;flex-wrap:wrap}
.quick-nav .qn-pill{padding:.45rem 1rem;font-size:.62rem;letter-spacing:.08em;border:1px solid var(--border);border-radius:100px;color:var(--text-soft);text-decoration:none;white-space:nowrap;transition:all .3s;font-family:var(--font-sans);background:transparent;flex-shrink:0}
.quick-nav .qn-pill:hover,.quick-nav .qn-pill.active{border-color:var(--gold);color:var(--gold);background:rgba(201,169,110,.08)}
.quick-nav .qn-back{font-size:.62rem;color:var(--text-dim);text-decoration:none;white-space:nowrap;padding:.45rem .5rem;margin-right:.5rem;flex-shrink:0}
.quick-nav .qn-back:hover{color:#fff}

@media(max-width:900px){
  .detail-hero{grid-template-columns:1fr;text-align:center;gap:2rem;padding:5rem 1.5rem 3rem}
  .dh-img img{width:55%}
  .dh-info .highlights{grid-template-columns:1fr}
  .nutrition-grid{grid-template-columns:1fr}
  #detail-feeding .feed-info{grid-template-columns:1fr}
  #gallery{padding:2rem 0 4rem}
  #nutrition,#detail-feeding,#related{padding:3rem 1.5rem}
  .related-grid{grid-template-columns:1fr}
  nav .links{display:none}
  .quick-nav{padding:.65rem 1rem;gap:.4rem}
  .quick-nav .qn-pill{padding:.35rem .7rem;font-size:.58rem}
}
</style>
</head>

    nutrition:{'粗蛋白':'≥52.0%','粗脂肪':'≥14.0%','粗灰分':'≤7.0%','粗纤维':'≤1.5%','牛磺酸':'≥0.35%','钙':'≥1.3%','磷':'≥1.1%','水分':'≤78.0%'},

function loadProduct(hash){
  const p=products[hash]||products.haikonglu;
  document.title=p.name+' — 优炙 YOUZHI';
  document.getElementById('heroImg').src=p.image;
  document.getElementById('heroImg').alt=p.name;
  document.getElementById('series').textContent=p.series;
  document.getElementById('productName').textContent=p.name;
  document.getElementById('subtitle').textContent=p.subtitle;
  document.getElementById('highlights').innerHTML=p.highlights.map(h=>`<div class="hl"><span class="dot"></span>${h}</div>`).join('');
  document.getElementById('tags').innerHTML=p.tags.map(t=>`<span>${t}</span>`).join('');
  document.getElementById('galleryGrid').innerHTML=p.gallery.map(g=>`<img src="assets/${g}" alt="${p.name}" loading="lazy" onerror="this.parentElement.removeChild(this)">`).join('');
  document.getElementById('nutritionGrid').innerHTML=Object.entries(p.nutrition).map(([k,v])=>`<div class="ng-item"><span class="ng-name">${k}</span><span class="ng-val">${v}</span></div>`).join('');
  document.getElementById('feedInfo').innerHTML=p.feeding.map(f=>`<div class="fi-item"><div class="fv">${f.v}</div><div class="fl">${f.l}</div></div>`).join('');
  const others=Object.entries(products).filter(([k])=>k!==hash);
  document.getElementById('relatedGrid').innerHTML=others.map(([k,v])=>`<a href="product.html#${k}" class="r-card"><img src="${v.image}" alt="${v.name}"><div class="rc-info"><div class="rc-series">${v.series}</div><div class="rc-name">${v.name}</div></div></a>`).join('');

  const qn=document.getElementById('quickNav');
  const short={haikonglu:'海陆空',roudannai:'肉蛋奶',liuxin:'蔓越莓',jisi:'鸡丝'};
  qn.innerHTML=`<a href="index.html" class="qn-back">← 首页</a>${Object.entries(short).map(([k,v])=>`<a href="product.html#${k}" class="qn-pill${k===hash?' active':''}">${v}</a>`).join('')}`;
}

let hash=window.location.hash.slice(1)||'haikonglu';
loadProduct(hash);
window.addEventListener('hashchange',()=>{
  loadProduct(window.location.hash.slice(1)||'haikonglu');
  window.scrollTo({top:0,behavior:'smooth'});
});
</script>
